<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">company-canteen architecture</title>
  <desc id="d">A React app talks to a .NET Web API backed by SQLite. The login flow uses JWT authentication with BCrypt password hashing. Future modules include menu management, ordering, feedback, and an AI triage worker. Planned deployment on Azure Container Apps with Grafana for observability.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#4B5563"/></marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E8B57"/></marker>
    <marker id="arre" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#7C3AED"/></marker>
  </defs>

  <rect width="1180" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="38" font-size="22" font-weight="700" fill="#111827">company-canteen</text>
  <text x="40" y="58" font-size="13" fill="#4B5563">Architecture: company canteen ordering with .NET API, React, and SQLite</text>

  <!-- ==================== Lane 1: Request path (BUILT) ==================== -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <!-- React app -->
    <rect x="40" y="90" width="230" height="100" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="155" y="118" font-weight="700">React + TypeScript app</text>
    <text x="155" y="138" font-size="11" fill="#4B5563">Vite dev server (port 5173)</text>
    <text x="155" y="154" font-size="11" fill="#4B5563">Login · Menu · Stock · Admin</text>
    <text x="155" y="170" font-size="11" fill="#4B5563">AuthContext · React Router</text>

    <!-- .NET API -->
    <rect x="400" y="90" width="260" height="100" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="530" y="118" font-weight="700">.NET 10 Web API</text>
    <text x="530" y="138" font-size="11" fill="#4B5563">Controllers · EF Core · BCrypt</text>
    <text x="530" y="154" font-size="11" fill="#4B5563">JWT Bearer authentication</text>
    <text x="530" y="170" font-size="11" fill="#4B5563">CORS · OpenAPI</text>
  </g>

  <!-- Request/response arrows -->
  <g stroke="#4B5563" stroke-width="1.8" fill="none">
    <path d="M270 120 H398" marker-end="url(#arr)"/>
    <path d="M398 160 H272" marker-end="url(#arr)"/>
  </g>
  <text x="334" y="114" font-size="11" text-anchor="middle" fill="#4B5563">POST /api/auth/*</text>
  <text x="334" y="177" font-size="11" text-anchor="middle" fill="#4B5563">{ token, user }</text>

  <!-- Login flow legend -->
  <g font-size="12" fill="#374151">
    <text x="720" y="100" font-weight="700" fill="#111827">Login flow (built)</text>
    <text x="720" y="120">1  User submits email + password</text>
    <text x="720" y="138">2  AuthController checks credentials</text>
    <text x="720" y="156">3  BCrypt verifies the password hash</text>
    <text x="720" y="174">4  AuthService signs a JWT (HS256)</text>
    <text x="720" y="192">5  Token stored in localStorage</text>
  </g>

  <!-- ==================== SQLite band ==================== -->
  <rect x="30" y="250" width="1120" height="100" rx="12" fill="#EAF7EE" stroke="#2E8B57" stroke-width="1.8"/>
  <text x="48" y="276" font-size="14" font-weight="700" fill="#1D5E3A">SQLite</text>
  <text x="48" y="295" font-size="11" fill="#1D5E3A">single-file database (canteen.db)</text>
  <text x="48" y="309" font-size="11" fill="#1D5E3A">EF Core code-first, auto-created on startup</text>
  <text x="48" y="331" font-size="11" fill="#1D5E3A">indexes: User.Email, (MenuItemId,Date)</text>

  <!-- Tables -->
  <g font-size="12" text-anchor="middle" fill="#111827">
    <rect x="380" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/>
    <text x="425" y="300" font-weight="600">Users</text>

    <rect x="480" y="277" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/>
    <text x="530" y="300" font-weight="600">MenuItems</text>

    <rect x="590" y="277" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/>
    <text x="640" y="300" font-weight="600">DailyStock</text>

    <rect x="700" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="745" y="300" font-weight="600" fill="#6B7280">Orders</text>

    <rect x="800" y="277" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="850" y="300" font-weight="600" fill="#6B7280">Feedback</text>

    <rect x="910" y="277" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="965" y="300" font-weight="600" fill="#6B7280">Summaries</text>
  </g>

  <!-- API to SQLite -->
  <path d="M530 190 V248" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)" marker-start="url(#arrd)"/>
  <text x="542" y="224" font-size="11" fill="#1D5E3A">EF Core</text>

  <!-- ==================== Lane 3: Future modules (dashed) ==================== -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <!-- Menu + Stock controllers (built) -->
    <rect x="40" y="410" width="220" height="80" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="150" y="436" font-weight="700">MenuController</text>
    <text x="150" y="454" font-size="11" fill="#4B5563">CRUD for menu items (admin)</text>
    <text x="150" y="472" font-size="11" fill="#4B5563">StockController: daily stock</text>

    <!-- Order controller -->
    <rect x="290" y="410" width="220" height="80" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="400" y="440" font-weight="700" fill="#6B7280">OrderController</text>
    <text x="400" y="460" font-size="11" fill="#9CA3AF">place order · track status · history</text>

    <!-- Feedback controller -->
    <rect x="540" y="410" width="220" height="80" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="650" y="440" font-weight="700" fill="#6B7280">FeedbackController</text>
    <text x="650" y="460" font-size="11" fill="#9CA3AF">submit · list · AI triage</text>

    <!-- AI triage worker -->
    <rect x="800" y="410" width="220" height="80" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="910" y="440" font-weight="700" fill="#6B7280">AI Triage Service</text>
    <text x="910" y="460" font-size="11" fill="#9CA3AF">classify · prioritise · summarise</text>

    <!-- LLM API -->
    <rect x="800" y="530" width="220" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="910" y="558" font-weight="700" fill="#6B7280">LLM API (external)</text>
    <text x="910" y="578" font-size="11" fill="#9CA3AF">structured JSON responses</text>

    <!-- SignalR hub -->
    <rect x="40" y="530" width="220" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="150" y="558" font-weight="700" fill="#6B7280">SignalR Hub</text>
    <text x="150" y="578" font-size="11" fill="#9CA3AF">real-time order status updates</text>

    <!-- Background jobs -->
    <rect x="290" y="530" width="220" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="400" y="558" font-weight="700" fill="#6B7280">Background Jobs</text>
    <text x="400" y="578" font-size="11" fill="#9CA3AF">daily summary · stock reset</text>

    <!-- Notification service -->
    <rect x="540" y="530" width="220" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="650" y="558" font-weight="700" fill="#6B7280">Notification Service</text>
    <text x="650" y="578" font-size="11" fill="#9CA3AF">order ready · feedback reply</text>
  </g>

  <!-- Controllers to DB -->
  <path d="M150 410 V352" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)"/>
  <path d="M400 410 V352" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <path d="M650 410 V352" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>

  <!-- AI triage to LLM -->
  <path d="M910 490 V528" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- Step badges on login flow -->
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="278" cy="96" r="10" fill="#3B6FE0"/><text x="278" y="100">1</text>
    <circle cx="530" cy="214" r="10" fill="#2E8B57"/><text x="530" y="218">2</text>
  </g>

  <!-- ==================== Bottom: CI/CD + Observability ==================== -->
  <g font-size="13" fill="#111827">
    <rect x="40" y="630" width="520" height="70" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/>
    <text x="56" y="655" font-weight="700">CI/CD: GitHub Actions (planned)</text>
    <text x="56" y="675" font-size="12" fill="#4B5563">lint · test · build images → Azure Container Registry → Azure Container Apps</text>

    <rect x="600" y="630" width="540" height="70" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>
    <text x="616" y="655" font-weight="700">Observability (planned)</text>
    <text x="616" y="675" font-size="12" fill="#4B5563">OpenTelemetry → Prometheus → Grafana: orders/hr, prep time, feedback sentiment</text>
  </g>

  <!-- ==================== Legend ==================== -->
  <g font-size="11" fill="#4B5563">
    <line x1="40" y1="712" x2="76" y2="712" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arr)"/><text x="84" y="716">request / call</text>
    <line x1="220" y1="712" x2="256" y2="712" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrd)"/><text x="264" y="716">database access</text>
    <rect x="420" y="703" width="30" height="16" rx="4" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.3"/><text x="458" y="716">built</text>
    <rect x="520" y="703" width="30" height="16" rx="4" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3"/><text x="558" y="716">planned</text>
  </g>
</svg>
