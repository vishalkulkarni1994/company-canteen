<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">company-canteen architecture</title>
  <desc id="d">A React app talks to a .NET Web API backed by SQLite. Built: auth with JWT, menu management, ordering with cart and kitchen kanban, and order-ready notifications via polling. Future: feedback, AI triage, SignalR real-time updates.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#4B5563"/></marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E8B57"/></marker>
  </defs>

  <rect width="1180" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="38" font-size="22" font-weight="700" fill="#111827">company-canteen</text>
  <text x="40" y="58" font-size="13" fill="#4B5563">Architecture: company canteen ordering with .NET API, React, and SQLite</text>

  <!-- ==================== Lane 1: Request path (BUILT) ==================== -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <!-- React app -->
    <rect x="40" y="90" width="250" height="110" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="165" y="118" font-weight="700">React + TypeScript app</text>
    <text x="165" y="138" font-size="11" fill="#4B5563">Vite dev server (port 5173)</text>
    <text x="165" y="154" font-size="11" fill="#4B5563">Login · Menu · Cart · Orders</text>
    <text x="165" y="170" font-size="11" fill="#4B5563">Kitchen Kanban · Notifications</text>
    <text x="165" y="186" font-size="11" fill="#4B5563">AuthContext · React Router v7</text>

    <!-- .NET API -->
    <rect x="400" y="90" width="280" height="110" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="540" y="118" font-weight="700">.NET 10 Web API</text>
    <text x="540" y="138" font-size="11" fill="#4B5563">Auth · Menu · Stock · Order</text>
    <text x="540" y="154" font-size="11" fill="#4B5563">JWT Bearer · BCrypt · EF Core</text>
    <text x="540" y="170" font-size="11" fill="#4B5563">Status state machine</text>
    <text x="540" y="186" font-size="11" fill="#4B5563">CORS · OpenAPI</text>
  </g>

  <!-- Request/response arrows -->
  <g stroke="#4B5563" stroke-width="1.8" fill="none">
    <path d="M290 125 H398" marker-end="url(#arr)"/>
    <path d="M398 170 H292" marker-end="url(#arr)"/>
  </g>
  <text x="344" y="119" font-size="11" text-anchor="middle" fill="#4B5563">REST API calls</text>
  <text x="344" y="185" font-size="11" text-anchor="middle" fill="#4B5563">JSON responses</text>

  <!-- Built features legend -->
  <g font-size="12" fill="#374151">
    <text x="730" y="100" font-weight="700" fill="#111827">Built features</text>
    <text x="730" y="120">Phase 1  Authentication (JWT + BCrypt)</text>
    <text x="730" y="138">Phase 2  Menu + stock management</text>
    <text x="730" y="156">Phase 3  Ordering (cart, kitchen kanban)</text>
    <text x="730" y="174">Phase 4  Order-ready notifications (polling)</text>
  </g>

  <!-- ==================== SQLite band ==================== -->
  <rect x="30" y="250" width="1120" height="100" rx="12" fill="#EAF7EE" stroke="#2E8B57" stroke-width="1.8"/>
  <text x="48" y="276" font-size="14" font-weight="700" fill="#1D5E3A">SQLite</text>
  <text x="48" y="295" font-size="11" fill="#1D5E3A">single-file database (canteen.db)</text>
  <text x="48" y="309" font-size="11" fill="#1D5E3A">EF Core code-first, auto-created on startup</text>
  <text x="48" y="331" font-size="11" fill="#1D5E3A">indexes: User.Email, (MenuItemId,Date)</text>

  <!-- Tables -->
  <g font-size="12" text-anchor="middle" fill="#111827">
    <rect x="350" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/>
    <text x="395" y="300" font-weight="600">Users</text>

    <rect x="450" y="277" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/>
    <text x="500" y="300" font-weight="600">MenuItems</text>

    <rect x="560" y="277" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/>
    <text x="610" y="300" font-weight="600">DailyStock</text>

    <rect x="670" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/>
    <text x="715" y="300" font-weight="600">Orders</text>

    <rect x="770" y="277" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/>
    <text x="820" y="300" font-weight="600">OrderItems</text>

    <rect x="880" y="277" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="930" y="300" font-weight="600" fill="#6B7280">Feedback</text>

    <rect x="990" y="277" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="1045" y="300" font-weight="600" fill="#6B7280">Summaries</text>
  </g>

  <!-- API to SQLite -->
  <path d="M540 200 V248" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)" marker-start="url(#arrd)"/>
  <text x="552" y="230" font-size="11" fill="#1D5E3A">EF Core</text>

  <!-- ==================== Lane 3: Controllers ==================== -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <!-- Auth controller (built) -->
    <rect x="40" y="410" width="200" height="80" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="140" y="436" font-weight="700">AuthController</text>
    <text x="140" y="454" font-size="11" fill="#4B5563">login · register · me</text>
    <text x="140" y="472" font-size="11" fill="#4B5563">JWT + BCrypt</text>

    <!-- Menu + Stock controllers (built) -->
    <rect x="260" y="410" width="200" height="80" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="360" y="436" font-weight="700">MenuController</text>
    <text x="360" y="454" font-size="11" fill="#4B5563">CRUD menu items (admin)</text>
    <text x="360" y="472" font-size="11" fill="#4B5563">StockController: daily stock</text>

    <!-- Order controller (built) -->
    <rect x="480" y="410" width="200" height="80" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="580" y="436" font-weight="700">OrderController</text>
    <text x="580" y="454" font-size="11" fill="#4B5563">place · track · cancel</text>
    <text x="580" y="472" font-size="11" fill="#4B5563">status machine · stock mgmt</text>

    <!-- Notification (built) -->
    <rect x="700" y="410" width="200" height="80" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="800" y="436" font-weight="700">Notifications</text>
    <text x="800" y="454" font-size="11" fill="#4B5563">polling (10s interval)</text>
    <text x="800" y="472" font-size="11" fill="#4B5563">toast on order ready</text>

    <!-- Feedback controller (planned) -->
    <rect x="920" y="410" width="200" height="80" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1020" y="440" font-weight="700" fill="#6B7280">FeedbackController</text>
    <text x="1020" y="460" font-size="11" fill="#9CA3AF">submit · list · AI triage</text>

    <!-- SignalR hub (planned) -->
    <rect x="40" y="530" width="200" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="140" y="558" font-weight="700" fill="#6B7280">SignalR Hub</text>
    <text x="140" y="578" font-size="11" fill="#9CA3AF">real-time order updates</text>

    <!-- Background jobs (planned) -->
    <rect x="260" y="530" width="200" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="360" y="558" font-weight="700" fill="#6B7280">Background Jobs</text>
    <text x="360" y="578" font-size="11" fill="#9CA3AF">daily summary · stock reset</text>

    <!-- AI triage (planned) -->
    <rect x="480" y="530" width="200" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="580" y="558" font-weight="700" fill="#6B7280">AI Triage Service</text>
    <text x="580" y="578" font-size="11" fill="#9CA3AF">classify · prioritise · summarise</text>

    <!-- LLM API (planned) -->
    <rect x="700" y="530" width="200" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="800" y="558" font-weight="700" fill="#6B7280">LLM API (external)</text>
    <text x="800" y="578" font-size="11" fill="#9CA3AF">structured JSON responses</text>
  </g>

  <!-- Controllers to DB -->
  <path d="M140 410 V352" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)"/>
  <path d="M360 410 V352" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)"/>
  <path d="M580 410 V352" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)"/>
  <path d="M1020 410 V352" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>

  <!-- AI triage to LLM -->
  <path d="M580 600 V528" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <path d="M680 565 H698" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>

  <!-- ==================== Bottom: CI/CD + Observability ==================== -->
  <g font-size="13" fill="#111827">
    <rect x="40" y="630" width="520" height="70" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/>
    <text x="56" y="655" font-weight="700">CI/CD: GitHub Actions (planned)</text>
    <text x="56" y="675" font-size="12" fill="#4B5563">lint · test · build images → Azure Container Registry → Azure Container Apps</text>

    <rect x="600" y="630" width="540" height="70" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>
    <text x="616" y="655" font-weight="700">Observability (planned)</text>
    <text x="616" y="675" font-size="12" fill="#4B5563">OpenTelemetry → Prometheus → Grafana: orders/hr, prep time, feedback sentiment</text>
  </g>

  <!-- ==================== Legend ==================== -->
  <g font-size="11" fill="#4B5563">
    <line x1="40" y1="712" x2="76" y2="712" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arr)"/><text x="84" y="716">request / call</text>
    <line x1="220" y1="712" x2="256" y2="712" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrd)"/><text x="264" y="716">database access</text>
    <rect x="420" y="703" width="30" height="16" rx="4" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.3"/><text x="458" y="716">built</text>
    <rect x="520" y="703" width="30" height="16" rx="4" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3"/><text x="558" y="716">planned</text>
  </g>
</svg>
